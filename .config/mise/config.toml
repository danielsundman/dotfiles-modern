# Global runtime versions. Per-project versions come from .mise.toml,
# .tool-versions or .nvmrc files.
[tools]
node = "24"
python = "3.13"

[settings]
# Read .nvmrc / .python-version files in existing projects
idiomatic_version_file_enable_tools = ["node", "python"]
# Let uv create venvs with the mise-managed Python
python.uv_venv_auto = true
